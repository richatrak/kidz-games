<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kidz.tw 遊戲</title>
<meta name="description" content="給小孩打發時間的小遊戲：數字連連看，可以印成 A4，也能在平板上玩。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="kidz 遊戲">
<meta name="theme-color" content="#e5e9ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171d" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f2b400'/%3E%3Cpolyline points='13,44 30,16 51,38' fill='none' stroke='%232b2100' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cg fill='%232b2100'%3E%3Ccircle cx='13' cy='44' r='5'/%3E%3Ccircle cx='30' cy='16' r='5'/%3E%3Ccircle cx='51' cy='38' r='5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{
  --desk:#e5e9ee; --panel:#f6f8fa; --rule:#cbd3dc; --fg:#1b222b; --muted:#566170;
  --pencil:#f2b400; --pencil-ink:#2b2100;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Nunito","Arial Rounded MT Bold","Arial",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --desk:#12171d; --panel:#1a2028; --rule:#2d3641; --fg:#e4e9ef; --muted:#9aa5b2;
  --pencil:#f5c22b; --pencil-ink:#241b00; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6}
.page{max-width:760px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kicker{font:500 12px/1 var(--f-body);letter-spacing:.14em;color:var(--muted);margin:0 0 12px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,46px);line-height:1.1;margin:0 0 8px;letter-spacing:.05em}
.lede{margin:0 0 28px;color:var(--muted)}
.games{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.game{display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:18px;color:inherit;text-decoration:none;min-height:56px}
.game:hover{border-color:var(--pencil)}
.game:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.game svg{width:92px;height:auto;flex:none;background:#fff;border-radius:10px;padding:8px}
.game h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px}
.game p{margin:0;color:var(--muted);font-size:15px}
footer{margin-top:40px;font-size:14px;color:var(--muted)}
.head{display:flex;align-items:flex-start;gap:16px}
.head>div{flex:1;min-width:0}
.reload{appearance:none;border:1px solid var(--rule);background:var(--panel);color:var(--fg);border-radius:999px;width:48px;height:48px;font-size:20px;line-height:1;cursor:pointer;flex:none}
.reload:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div>
      <p class="kicker">KIDZ.TW</p>
      <h1>遊戲</h1>
      <p class="lede">打發時間用的小遊戲。可以印出來，也可以在平板上玩。</p>
    </div>
    <button type="button" class="reload" id="btnReload" aria-label="重新載入" title="重新載入（加到主畫面後沒有網址列可以重新整理）">↻</button>
  </div>
  <ul class="games">
    <li>
      <a class="game" href="dot-to-dot/index.html">
        <svg viewBox="0 0 100 80" aria-hidden="true"><polyline points="16,64 50,14 84,64" fill="none" stroke="#f2b400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="16" y1="64" x2="84" y2="64" stroke="#cbd3dc" stroke-width="2" stroke-dasharray="3 4"/><g fill="#141414"><circle cx="16" cy="64" r="4"/><circle cx="50" cy="14" r="4"/><circle cx="84" cy="64" r="4"/><text x="8" y="58" font-size="13" font-family="Nunito,Arial,sans-serif" font-weight="800">1</text><text x="56" y="16" font-size="13" font-family="Nunito,Arial,sans-serif" font-weight="800">2</text><text x="86" y="58" font-size="13" font-family="Nunito,Arial,sans-serif" font-weight="800">3</text></g></svg>
        <div>
          <h2>數字連連看</h2>
          <p>照數字順序連起來，會變成一張圖。內建圖可以直接用，也能把自己的圖變成連連看。</p>
        </div>
      </a>
    </li>
    <li>
      <a class="game" href="english-word-match/index.html">
        <svg viewBox="0 0 100 80" aria-hidden="true"><rect x="10" y="12" width="36" height="52" rx="6" fill="#2f4cb3" transform="rotate(-8 28 38)"/><text x="28" y="44" font-size="15" font-weight="700" fill="#fff" fill-opacity=".7" text-anchor="middle" font-family="Andika,Arial,sans-serif" transform="rotate(-8 28 38)">Aa</text><rect x="52" y="12" width="36" height="52" rx="6" fill="#fff" stroke="#17212b" stroke-width="2.5" transform="rotate(7 70 38)"/><text x="70" y="44" font-size="13" font-weight="700" fill="#17212b" text-anchor="middle" font-family="Andika,Arial,sans-serif" transform="rotate(7 70 38)">cat</text></svg>
        <div>
          <h2>英文翻牌配對</h2>
          <p>圖卡配英文字卡，翻開會唸英文。可以選主題和張數，也能貼上課本的單字。</p>
        </div>
      </a>
    </li>
  </ul>
  <footer>其他小工具：<a href="https://schedule.kidz.tw">作息鐘</a>、<a href="https://math.kidz.tw">數學練習</a></footer>
</div>
<script>document.getElementById('btnReload').addEventListener('click', () => location.reload());</script>
</body>
</html>
